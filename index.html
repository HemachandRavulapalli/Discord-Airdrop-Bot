<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airdrop Commander | Professional Dispatcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.8);
            --border-color: #30363d;
            --accent-color: #5865f2;
            --accent-glow: rgba(88, 101, 242, 0.3);
            --text-main: #c9d1d9;
            --text-heading: #ffffff;
            --success: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(88, 101, 242, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(138, 43, 226, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Outfit', 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 25px;
        }

        h1 {
            grid-column: 1 / -1;
            font-size: 3rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff 0%, #5865f2 50%, #8a2be2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            filter: drop-shadow(0 0 20px var(--accent-glow));
        }

        .presets-bar {
            grid-column: 1 / -1;
            display: flex;
            gap: 15px;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .panel:hover {
            border-color: var(--accent-color);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-heading);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #8b949e;
        }

        input,
        textarea,
        select {
            width: 100%;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .drop-zone {
            width: 100%;
            height: 120px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
            color: #8b949e;
            position: relative;
            overflow: hidden;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--accent-color);
            background: rgba(88, 101, 242, 0.05);
            color: white;
        }

        .drop-zone img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .chip {
            background: var(--accent-color);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: default;
        }

        /* Live Preview Styles */
        .preview-content {
            background: #313338;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Inter', sans-serif;
        }

        .discord-title {
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .discord-body {
            color: #dbdee1;
            white-space: pre-wrap;
            margin-bottom: 12px;
        }

        .discord-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: none;
        }

        .json-viewer {
            background: #010409;
            padding: 15px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #79c0ff;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            margin-top: 20px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            grid-column: span 2;
        }

        .btn-primary:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .log-panel {
            grid-column: 1 / -1;
            background: rgba(1, 4, 9, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            position: relative;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #8a2be2);
            box-shadow: 0 0 15px var(--accent-color);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .channel-status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .status-idle {
            background: rgba(139, 148, 158, 0.2);
            color: #8b949e;
        }

        .status-running {
            background: rgba(210, 153, 34, 0.2);
            color: #d29922;
            animation: pulse 1.5s infinite;
        }

        .status-success {
            background: rgba(63, 185, 80, 0.2);
            color: #3fb950;
        }

        .status-error {
            background: rgba(248, 81, 73, 0.2);
            color: #f85149;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #21262d;
            display: grid;
            grid-template-columns: 100px 100px 150px 1fr;
            gap: 15px;
            font-size: 0.85rem;
        }

        .log-success {
            color: #3fb950;
        }

        .log-error {
            color: #f85149;
        }

        .log-processing {
            color: #d29922;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 0 50px rgba(88, 101, 242, 0.2);
        }

        .discovery-item {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #21262d;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .discovery-item:hover {
            background: rgba(88, 101, 242, 0.15);
            border-color: var(--accent-color);
        }

        .tag-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            background: #30363d;
            color: #8b949e;
        }

        .explorer-check {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .btn-secondary {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: #c9d1d9;
        }

        .btn-secondary:hover {
            background: #30363d;
        }

        .channel-item {
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            position: relative;
        }

        .remove-channel {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            color: #f85149;
            font-size: 1.2rem;
        }

        .tag-chip,
        .role-chip {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            background: #30363d;
            color: #c9d1d9;
            font-size: 0.75rem;
            margin-right: 5px;
            margin-bottom: 5px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
            user-select: none;
        }

        .tag-chip.active,
        .role-chip.active {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .tag-chip:hover,
        .role-chip:hover {
            border-color: var(--accent-color);
        }

        .embed-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(88, 101, 242, 0.1);
            border-radius: 8px;
            border: 1px solid var(--accent-color);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Airdrop Commander</h1>

        <div class="presets-bar">
            <span style="font-weight: 600; color: white;">📁 Presets:</span>
            <select id="presetSelect" style="width: 200px; padding: 8px;">
                <option value="">Select a Preset...</option>
            </select>
            <button class="btn-secondary" style="padding: 8px 15px;" onclick="loadPreset()">Load</button>
            <button class="btn-secondary" style="padding: 8px 15px; color: #f85149;"
                onclick="deletePreset()">Delete</button>
            <input type="text" id="presetName" placeholder="Preset Name" style="width: 150px; padding: 8px;">
            <button class="btn-primary" style="padding: 8px 15px; grid-column: auto;"
                onclick="savePreset()">Save</button>
            <button class="btn-secondary" style="margin-left: auto; background: #238636; color: white;"
                onclick="openExplorer()">🛰️ Browse Servers</button>
        </div>

        <div class="panel">
            <div class="section-title">🚀 Airdrop Details</div>
            <div class="form-group"><label>Post Title</label><input type="text" id="title" oninput="updatePreview()">
            </div>
            <div class="form-group"><label>Content</label><textarea id="content" rows="5"
                    oninput="updatePreview()"></textarea></div>
            <div class="embed-toggle">
                <input type="checkbox" id="useEmbed" onchange="updatePreview()"><label for="useEmbed"
                    style="margin:0">💎 Use Rich Embed</label>
                <input type="color" id="embedColor" value="#5865f2" oninput="updatePreview()"
                    style="width:40px; height:30px;">
            </div>
            <div class="drop-zone" id="dropZone"><span id="dropText">📸 Image</span><img id="imagePreview"><input
                    type="file" id="fileInput" hidden></div>

            <div class="section-title" style="margin-top: 40px; justify-content: space-between;">
                <span>📍 Target Channels</span>
                <div style="display:flex; gap:10px;">
                    <button class="btn-secondary" style="font-size:0.75rem;" onclick="syncTagsByName()">🏷️ Sync
                        Tags</button>
                    <button class="btn-secondary" style="font-size:0.75rem;" onclick="syncRolesByName()">👤 Sync
                        Roles</button>
                    <button class="btn-secondary" style="font-size:0.75rem; background:#f85149; color:white;"
                        onclick="clearChannels()">🗑️ Clear</button>
                </div>
            </div>
            <div id="channelsList"></div>
            <button class="btn-secondary" style="width: 100%; border-style: dashed; margin-top:10px;"
                onclick="addChannel()">+ Add Channel</button>

            <div class="button-group">
                <button class="btn-secondary" onclick="generateJSON()">Generate JSON</button>
                <button class="btn-secondary" onclick="copyJSON()">Copy JSON</button>
                <button class="btn-primary" onclick="sendToBot()">DISPATCH TO DISCORD</button>
            </div>
        </div>

        <div class="panel" style="position: sticky; top: 20px; height: fit-content;">
            <div class="section-title">👀 Live Preview</div>
            <div class="preview-content" id="livePreview">
                <div class="discord-title" id="prevTitle">Airdrop Title</div>
                <div class="discord-body" id="prevText">Content...</div>
                <img id="prevImage" class="discord-image">
            </div>
            <div class="json-viewer" id="jsonViewer">{ }</div>
        </div>

        <div class="log-panel" id="logPanel">
            <div class="section-title">🛡️ Mission Control Logs <div id="statusPulse"
                    style="width:10px; height:10px; border-radius:50%; background:#30363d;"></div>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="logsContainer">
                <div style="color:#8b949e; text-align:center;">All systems operational.</div>
            </div>
        </div>
    </div>

    <div id="explorerModal" class="modal-overlay" onclick="closeExplorer()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="section-title" style="justify-content: space-between;"><span>🛰️ Server Explorer</span><span
                    style="cursor:pointer" onclick="closeExplorer()">&times;</span></div>
            <div
                style="display:flex; gap:10px; margin-bottom:15px; background: rgba(88, 101, 242, 0.05); padding: 15px; border-radius: 10px; border: 1px solid var(--accent-glow);">
                <input type="text" id="explorerSearch" placeholder="🔍 Search Channels & Active Posts..."
                    oninput="filterExplorer()" style="flex:1">
                <button class="btn-primary" style="width:auto; padding:10px 20px; background:#238636"
                    onclick="bulkAddFiltered()">📑 Add Checked</button>
                <button class="btn-secondary" onclick="scanAllArchives()" id="scanAllBtn">🛰️ Scan All History</button>
                <button class="btn-primary" style="background:#5865F2" onclick="deepSearch()" id="deepSearchBtn">🔍
                    Global Archive Search</button>
            </div>

            <div style="display:flex; gap:10px; margin-bottom:15px; align-items: center; padding-left: 5px;">
                <input type="text" id="manualChannelId" placeholder="📍 Find by ID (Thread/Post ID)"
                    style="font-size: 0.85rem; flex:1">
                <button class="btn-secondary" style="white-space:nowrap;" onclick="addManualThreadById()">📍 Find &
                    Add</button>
                <div
                    style="margin-left:auto; display:flex; align-items:center; gap:10px; font-size:0.85rem; color:#8b949e">
                    <input type="checkbox" id="explorerSelectAll" class="explorer-check" onclick="toggleSelectAll()">
                    <label for="explorerSelectAll" style="margin:0; cursor:pointer; white-space:nowrap;">Select
                        Visible</label>
                </div>
            </div>
            <div id="globalSearchResults"
                style="margin-bottom: 20px; display: none; background: rgba(88, 101, 242, 0.1); border: 1px dashed var(--accent-color); border-radius: 10px; padding: 15px;">
                <div class="section-title" style="font-size: 0.9rem; color: var(--accent-color);">🔎 Global Search
                    Results</div>
                <div id="globalSearchList"></div>
            </div>
            <div id="explorerResults" style="margin-top: 10px;"></div>
        </div>

        <script>
            let imageDataURI = null;
            let channels = [];
            let logPoller = null;

            window.onload = () => { loadFromLocalStorage(); updatePreview(); refreshPresets(); };

            async function savePreset() {
                const name = document.getElementById('presetName').value;
                if (!name) return alert("Enter name");
                try {
                    await fetch('http://localhost:8000/presets', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, channels }) });
                    alert("Saved!"); refreshPresets();
                } catch (e) { alert("Save failed"); }
            }

            async function refreshPresets() {
                try {
                    const res = await fetch('http://localhost:8000/presets');
                    const presets = await res.json();
                    const select = document.getElementById('presetSelect');
                    select.innerHTML = '<option value="">Select a Preset...</option>';
                    presets.forEach(p => { const o = document.createElement('option'); o.value = p; o.innerText = p; select.appendChild(o); });
                } catch (e) { }
            }

            async function loadPreset() {
                const name = document.getElementById('presetSelect').value;
                if (!name) return;
                try {
                    const res = await fetch(`http://localhost:8000/presets/${name}`);
                    const data = await res.json();
                    channels = data.channels || [];
                    channels.forEach(c => c.id = Date.now() + Math.random());
                    renderChannels(); updatePreview();
                } catch (e) { alert("Load failed"); }
            }

            async function deletePreset() {
                const name = document.getElementById('presetSelect').value;
                if (!name) return alert("Select a preset to delete");
                if (!confirm(`Are you sure you want to delete the preset "${name}"?`)) return;
                try {
                    const res = await fetch(`http://localhost:8000/presets/${name}`, { method: 'DELETE' });
                    if (res.ok) {
                        alert("Preset deleted!");
                        refreshPresets();
                    } else {
                        alert("Failed to delete preset.");
                    }
                } catch (e) { alert("Delete failed"); }
            }

            function openExplorer() { document.getElementById('explorerModal').style.display = 'flex'; fetchDiscovery(); }
            function closeExplorer() { document.getElementById('explorerModal').style.display = 'none'; }

            async function fetchDiscovery() {
                try {
                    const res = await fetch('http://localhost:8000/explore');
                    renderExplorer(await res.json());
                } catch (e) { document.getElementById('explorerResults').innerHTML = 'Bot offline.'; }
            }

            function renderExplorer(guilds) {
                document.getElementById('explorerResults').innerHTML = guilds.map(g => {
                    const rolesStr = JSON.stringify(g.roles || []).replace(/"/g, '&quot;');
                    const channelHTML = g.channels.map(c => {
                        const tagsStr = JSON.stringify(c.available_tags || []).replace(/"/g, '&quot;');
                        const threadHTML = c.threads.map(t => `<div class="discovery-item explorer-item explorer-thread" style="margin-left:30px; display:none; align-items:center; gap:12px;" data-id="${t.id}" data-name="${t.name} (Post)" data-guild="${g.name}" data-guild-id="${g.id}" data-roles="${rolesStr}">
                        <input type="checkbox" class="explorer-check" onclick="event.stopPropagation()">
                        <div style="flex:1" onclick="addFoundChannel('${g.name}', '${t.id}', '${t.name} (Post)', [], ${rolesStr}, '${g.id}')"><b>↪ ${t.name}</b> <span class="tag-badge">ACTIVE</span></div>
                    </div>`).join('');
                        return `<div class="discovery-item explorer-item explorer-channel" style="display:flex; align-items:center; gap:12px;" data-id="${c.id}" data-name="${c.name}" data-guild="${g.name}" data-guild-id="${g.id}" data-tags="${tagsStr}" data-roles="${rolesStr}">
                        <input type="checkbox" class="explorer-check" onclick="event.stopPropagation()">
                        <div style="flex:1" onclick="addFoundChannel('${g.name}', '${c.id}', '${c.name}', ${tagsStr}, ${rolesStr}, '${g.id}')">
                            <div style="display:flex; justify-content:space-between; align-items:center;"><span># ${c.name} <span class="tag-badge" id="count-${c.id}">${c.threads.length > 0 ? c.threads.length + ' active' : c.type}</span></span>
                            ${(c.type === 'forum' || c.type === 'text') ? `<button class="btn-secondary" style="font-size:10px; padding:2px 6px;" onclick="event.stopPropagation(); fetchMoreThreads('${c.id}','${g.name}','${g.id}','${rolesStr}')">📅 Get All History</button>` : ''}</div>
                        </div>
                    </div><div id="extra-threads-${c.id}">${threadHTML}</div>`;
                    }).join('');
                    return `<h3>🏰 ${g.name}</h3>${channelHTML}`;
                }).join('');
            }

            function filterExplorer() {
                const q = document.getElementById('explorerSearch').value.toLowerCase();
                document.querySelectorAll('.explorer-item').forEach(i => {
                    const isThread = i.classList.contains('explorer-thread');
                    const isManuallyFetched = i.classList.contains('manually-fetched');

                    if (!q) {
                        // Reset: Show channels, Hide threads (unless it's a direct ID import which should stay visible)
                        const isManualImport = i.getAttribute('data-name').startsWith('Imported ID') || i.getAttribute('data-name').startsWith('Manual ID');
                        i.style.display = (isThread && !isManualImport) ? 'none' : 'flex';
                    } else {
                        const isManualImport = i.getAttribute('data-name').startsWith('Imported ID') || i.getAttribute('data-name').startsWith('Manual ID');
                        if (isManualImport) { i.style.display = 'flex'; return; }

                        const name = i.getAttribute('data-name').toLowerCase();
                        const guild = i.getAttribute('data-guild').toLowerCase();
                        const matches = name.includes(q) || guild.includes(q);

                        if (matches) {
                            i.style.display = 'flex';
                            // If it's a channel that matches, show all its threads too
                            if (i.classList.contains('explorer-channel')) {
                                const next = i.nextElementSibling;
                                if (next && next.id.startsWith('extra-threads-')) {
                                    Array.from(next.children).forEach(t => t.style.display = 'flex');
                                }
                            }
                        } else {
                            // If the item doesn't match, still show it if its PARENT channel matched
                            const parentContainer = i.parentElement;
                            if (parentContainer && parentContainer.id.startsWith('extra-threads-')) {
                                const parentChannel = parentContainer.previousElementSibling;
                                if (parentChannel && parentChannel.style.display === 'flex' && parentChannel.getAttribute('data-name').toLowerCase().includes(q)) {
                                    i.style.display = 'flex';
                                } else {
                                    i.style.display = 'none';
                                }
                            } else {
                                i.style.display = 'none';
                            }
                        }
                    }
                });
            }

            function toggleSelectAll() {
                const m = document.getElementById('explorerSelectAll');
                document.querySelectorAll('.explorer-item').forEach(i => { if (i.style.display !== 'none') i.querySelector('.explorer-check').checked = m.checked; });
            }

            async function fetchMoreThreads(cid, gn, gid, rs) {
                const btn = event ? event.target : null;
                const originalText = btn ? btn.innerText : "";
                if (btn) btn.innerText = "⏳ Scan...";

                try {
                    const res = await fetch(`http://localhost:8000/threads/${cid}`);
                    const threads = await res.json();

                    const container = document.getElementById(`extra-threads-${cid}`);
                    if (threads.length === 0) {
                        if (!event) return; // Silent if batch
                        alert("No additional threads found for this channel.");
                    }

                    container.innerHTML = threads.map(t => `<div class="discovery-item explorer-item explorer-thread manually-fetched" style="margin-left:30px; display:flex; align-items:center; gap:12px;" data-id="${t.id}" data-name="${t.name} (Thread)" data-guild="${gn}" data-guild-id="${gid}" data-roles="${rs}">
                    <input type="checkbox" class="explorer-check" onclick="event.stopPropagation()">
                    <div style="flex:1" onclick="addFoundChannel('${gn}', '${t.id}', '${t.name} (Thread)', [], ${rs}, '${gid}')"><b>↪ ${t.name}</b> <span class="tag-badge">THREAD</span></div>
                </div>`).join('');

                    if (event) filterExplorer();
                } catch (e) {
                    if (!event) return;
                    alert("Search failed.");
                }
                if (btn) btn.innerText = originalText;
            }

            async function scanAllArchives() {
                const channels = Array.from(document.querySelectorAll('.explorer-channel')).filter(i => i.style.display !== 'none');
                const btn = document.getElementById('scanAllBtn');
                const originalText = btn.innerText;

                if (!confirm(`This will deep-scan archives for ${channels.length} channels. Continue?`)) return;

                btn.disabled = true;
                let count = 0;
                for (const chan of channels) {
                    count++;
                    btn.innerText = `⏳ Scanning (${count}/${channels.length})...`;
                    const id = chan.getAttribute('data-id');
                    const gn = chan.getAttribute('data-guild');
                    const gid = chan.getAttribute('data-guild-id');
                    const rs = chan.getAttribute('data-roles');

                    // Call fetch without event object to handle batch
                    await fetchMoreThreadsBatch(id, gn, gid, rs);
                    // Simple delay to avoid rate limits
                    await new Promise(r => setTimeout(r, 100));
                }
                btn.innerText = originalText;
                btn.disabled = false;
                filterExplorer();
                alert("Deep scan complete! All old posts are now searchable.");
            }

            async function deepSearch() {
                const q = document.getElementById('explorerSearch').value.trim();
                if (!q) return alert("Please enter a name or keyword to search for.");
                const btn = document.getElementById('deepSearchBtn');
                btn.innerText = "⏳ Searching Discord Archives...";
                btn.disabled = true;

                try {
                    const res = await fetch(`http://localhost:8000/search-all?q=${encodeURIComponent(q)}`);
                    const results = await res.json();
                    const container = document.getElementById('globalSearchResults');
                    const list = document.getElementById('globalSearchList');

                    if (results.length === 0) {
                        alert("No matching posts found in archives.");
                        container.style.display = 'none';
                    } else {
                        container.style.display = 'block';
                        list.innerHTML = results.map(r => {
                            const icon = r.status === 'active' ? '🟢' : '📂';
                            return `<div class="discovery-item explorer-item" style="display:flex; align-items:center; gap:12px;" data-id="${r.id}" data-name="${r.name}" data-guild="${r.guild}">
                            <input type="checkbox" class="explorer-check" onclick="event.stopPropagation()">
                            <div style="flex:1" onclick="addFoundChannel('${r.guild}', '${r.id}', '${r.name}', [], [], '${r.guild_id}')">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <span>${icon} <b>${r.name}</b> <span class="tag-badge">${r.status.toUpperCase()}</span></span>
                                    <span style="font-size: 0.75rem; color: #8b949e">Server: ${r.guild}</span>
                                </div>
                            </div>
                        </div>`;
                        }).join('');
                    }
                } catch (e) { alert("Search failed."); }
                btn.innerText = "🔍 Global Archive Search";
                btn.disabled = false;
            }

            async function fetchMoreThreadsBatch(cid, gn, gid, rs) {
                try {
                    const res = await fetch(`http://localhost:8000/threads/${cid}`);
                    const threads = await res.json();
                    const container = document.getElementById(`extra-threads-${cid}`);
                    const countBadge = document.getElementById(`count-${cid}`);
                    if (threads && threads.length > 0) {
                        if (countBadge) countBadge.innerText = `${threads.length} items synced`;
                        container.innerHTML = threads.map(t => `<div class="discovery-item explorer-item explorer-thread archived-post" style="margin-left:30px; display:none; align-items:center; gap:12px;" data-id="${t.id}" data-name="${t.name} (Historic Post)" data-guild="${gn}" data-guild-id="${gid}" data-roles="${rs}">
                        <input type="checkbox" class="explorer-check" onclick="event.stopPropagation()">
                        <div style="flex:1" onclick="addFoundChannel('${gn}', '${t.id}', '${t.name} (Historic)', [], ${rs}, '${gid}')"><b>↪ ${t.name}</b> <span class="tag-badge" style="background:#5c4731">HISTORIC</span></div>
                    </div>`).join('');
                    } else if (countBadge) {
                        countBadge.innerText = 'empty';
                    }
                } catch (e) { }
            }

            function bulkAddFiltered() {
                const checked = Array.from(document.querySelectorAll('.explorer-item')).filter(i => i.style.display !== 'none' && i.querySelector('.explorer-check').checked);
                const visible = Array.from(document.querySelectorAll('.explorer-item')).filter(i => i.style.display !== 'none');
                const targets = checked.length > 0 ? checked : visible;
                if (targets.length === 0) return;
                targets.forEach(i => {
                    const id = i.getAttribute('data-id');
                    if (channels.some(c => c.channelId === id)) return;
                    const gid = i.getAttribute('data-guild-id');
                    channels.push({ id: Date.now() + Math.random(), nickname: `${i.getAttribute('data-guild')} | ${i.getAttribute('data-name')}`, channelId: id, guildId: gid, tagIds: [], available_tags: JSON.parse(i.getAttribute('data-tags') || '[]'), available_roles: JSON.parse(i.getAttribute('data-roles') || '[]'), roleId: getRoleMemory(gid) || '', status: 'idle' });
                });
                renderChannels(); saveToLocalStorage(); closeExplorer();
            }

            function addFoundChannel(gn, id, n, ts = [], rs = [], gid = '') {
                if (channels.some(c => c.channelId === id)) { closeExplorer(); return; }
                channels.push({ id: Date.now(), nickname: `${gn} | ${n}`, channelId: id, guildId: gid, tagIds: [], available_tags: ts, available_roles: rs, roleId: getRoleMemory(gid) || '', status: 'idle' });
                renderChannels(); saveToLocalStorage(); closeExplorer();
            }

            function saveToLocalStorage() { localStorage.setItem('airdrop_commander_data', JSON.stringify({ title: document.getElementById('title').value, content: document.getElementById('content').value, channels, useEmbed: document.getElementById('useEmbed').checked, embedColor: document.getElementById('embedColor').value })); }
            function loadFromLocalStorage() {
                const saved = localStorage.getItem('airdrop_commander_data');
                if (!saved) { addChannel(); return; }
                const data = JSON.parse(saved);
                document.getElementById('title').value = data.title || '';
                document.getElementById('content').value = data.content || '';
                document.getElementById('useEmbed').checked = data.useEmbed || false;
                document.getElementById('embedColor').value = data.embedColor || '#5865f2';
                channels = data.channels || [];
                if (channels.length === 0) addChannel(); else renderChannels();
            }

            function updatePreview() {
                saveToLocalStorage();
                const use = document.getElementById('useEmbed').checked;
                const p = document.getElementById('livePreview');
                p.style.borderLeft = use ? `4px solid ${document.getElementById('embedColor').value}` : 'none';
                p.style.background = use ? '#1e1f22' : '#313338';
                document.getElementById('prevTitle').innerText = document.getElementById('title').value || 'Title';
                document.getElementById('prevText').innerText = document.getElementById('content').value || 'Content...';
                const img = document.getElementById('prevImage');
                if (imageDataURI) { img.src = imageDataURI; img.style.display = 'block'; } else img.style.display = 'none';
            }

            // Image History Management
            let imageHistory = [null];
            let historyIndex = 0;

            function saveImageToHistory(data) {
                // If we are not at the end of history, truncate it
                if (historyIndex < imageHistory.length - 1) {
                    imageHistory = imageHistory.slice(0, historyIndex + 1);
                }
                imageHistory.push(data);
                historyIndex++;
                applyImageFromHistory();
            }

            function undoImage() {
                if (historyIndex > 0) {
                    historyIndex--;
                    applyImageFromHistory();
                }
            }

            function redoImage() {
                if (historyIndex < imageHistory.length - 1) {
                    historyIndex++;
                    applyImageFromHistory();
                }
            }

            function deleteImage() {
                if (imageDataURI !== null) {
                    saveImageToHistory(null);
                }
            }

            function applyImageFromHistory() {
                imageDataURI = imageHistory[historyIndex];
                const imgPreview = document.getElementById('imagePreview');
                const dropText = document.getElementById('dropText');

                if (imageDataURI) {
                    imgPreview.src = imageDataURI;
                    imgPreview.style.display = 'block';
                    dropText.style.display = 'none';
                } else {
                    imgPreview.src = '';
                    imgPreview.style.display = 'none';
                    dropText.style.display = 'block';
                }
                updatePreview();
            }

            // Global Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                // Don't trigger if user is typing in an input or textarea
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                // Undo: Ctrl + Z
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
                    e.preventDefault();
                    undoImage();
                }
                // Redo: Ctrl + Y or Ctrl + Shift + Z
                if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
                    e.preventDefault();
                    redoImage();
                }
                // Delete: Delete or Backspace
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    deleteImage();
                }
            });

            const dz = document.getElementById('dropZone');
            dz.onclick = () => document.getElementById('fileInput').click();

            document.getElementById('fileInput').onchange = (e) => {
                handleImageFile(e.target.files[0]);
            };

            // Handle Paste (Ctrl+V)
            document.addEventListener('paste', (e) => {
                // Special handling for paste: if it's an image, we save it to history
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (const item of items) {
                    if (item.kind === 'file' && item.type.startsWith('image/')) {
                        handleImageFile(item.getAsFile());
                    }
                }
            });

            // Handle Drag & Drop
            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                dz.classList.add('dragover');
            });

            window.addEventListener('dragleave', () => {
                dz.classList.remove('dragover');
            });

            window.addEventListener('drop', (e) => {
                e.preventDefault();
                dz.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleImageFile(e.dataTransfer.files[0]);
                }
            });

            function handleImageFile(file) {
                if (!file || !file.type.startsWith('image/')) return;
                const r = new FileReader();
                r.onload = (ev) => {
                    saveImageToHistory(ev.target.result);
                };
                r.readAsDataURL(file);
            }



            function addChannel() { channels.push({ id: Date.now(), nickname: '', channelId: '', tagIds: [], available_tags: [], available_roles: [], roleId: '', guildId: '', status: 'idle' }); renderChannels(); saveToLocalStorage(); }
            function removeChannel(id) { channels = channels.filter(c => c.id !== id); renderChannels(); saveToLocalStorage(); }
            function clearChannels() { if (confirm("Clear?")) { channels = []; addChannel(); renderChannels(); saveToLocalStorage(); } }
            function updateChannelData(id, f, v) { const c = channels.find(x => x.id === id); if (f === 'tagIds') c.tagIds = v.split(',').map(s => s.trim()).filter(s => s); else c[f] = v; saveToLocalStorage(); }

            function renderChannels() {
                const container = document.getElementById('channelsList');
                container.innerHTML = '';
                channels.forEach(c => {
                    const div = document.createElement('div'); div.className = 'channel-item'; div.id = `card-${c.id}`;
                    const isT = c.nickname?.includes('(Thread)');
                    let tags = (!isT && c.available_tags?.length > 0) ? `<div class="form-group"><label>🏷️ Tags</label><div>${c.available_tags.map(t => `<span class="tag-chip ${c.tagIds.includes(t.id) ? 'active' : ''}" onclick="toggleTag(${c.id},'${t.id}')">${t.name}</span>`).join('')}</div></div>` : '';
                    let roles = (c.available_roles?.length > 0) ? `<div class="form-group"><label>👤 Role</label><div>${c.available_roles.map(r => `<span class="role-chip ${c.roleId === r.id ? 'active' : ''}" onclick="toggleRole(${c.id},'${r.id}')">${r.name}</span>`).join('')}</div></div>` : `<div class="form-group"><label>Role ID</label><input type="text" value="${c.roleId || ''}" oninput="updateChannelData(${c.id},'roleId',this.value)"></div>`;
                    div.innerHTML = `
                    <div class="remove-channel" onclick="removeChannel(${c.id})">✕</div>
                    <div class="channel-status-badge status-${c.status}">${c.status}</div>
                    <div class="form-group"><label>Nickname</label><input type="text" value="${c.nickname}" oninput="updateChannelData(${c.id},'nickname',this.value)"></div>
                    <div class="form-group"><label>ID</label><div style="display:flex;gap:10px;"><input type="text" value="${c.channelId}" oninput="updateChannelData(${c.id},'channelId',this.value)"><button class="btn-secondary" style="font-size:0.7rem;" onclick="fetchTags(${c.id})">Sync</button></div></div>
                    ${tags} ${roles}`;
                    container.appendChild(div);
                });
            }

            async function fetchTags(cid) {
                const c = channels.find(x => x.id === cid);
                try {
                    const [ts, rs] = await Promise.all([fetch(`http://localhost:8000/tags/${c.channelId}`).then(r => r.json()), fetch(`http://localhost:8000/roles/${c.channelId}`).then(r => r.json())]);
                    c.available_tags = ts; c.available_roles = rs;
                    if (rs.length > 0) { c.guildId = rs[0].guild_id; if (!c.roleId) c.roleId = getRoleMemory(c.guildId) || ''; }
                    renderChannels(); saveToLocalStorage();
                } catch (e) { }
            }

            function toggleTag(cid, tid) { const c = channels.find(x => x.id === cid); if (c.tagIds.includes(tid)) c.tagIds = c.tagIds.filter(id => id !== tid); else c.tagIds.push(tid); renderChannels(); saveToLocalStorage(); }
            function toggleRole(cid, rid) { const c = channels.find(x => x.id === cid); c.roleId = (c.roleId === rid) ? '' : rid; if (c.roleId && c.guildId) saveRoleMemory(c.guildId, c.roleId); renderChannels(); saveToLocalStorage(); }
            function saveRoleMemory(gid, rid) { let m = JSON.parse(localStorage.getItem('guildRoleMemory') || '{}'); m[gid] = rid; localStorage.setItem('guildRoleMemory', JSON.stringify(m)); }
            function getRoleMemory(gid) { return JSON.parse(localStorage.getItem('guildRoleMemory') || '{}')[gid] || null; }

            async function pollLogs() {
                try {
                    const res = await fetch('http://localhost:8000/logs');
                    const logs = await res.json();
                    const total = channels.length, done = logs.filter(l => l.status === 'success' && (l.message.includes('Sent') || l.message.includes('Created'))).length;
                    document.getElementById('progressBar').style.width = `${total ? (done / total) * 100 : 0}%`;
                    logs.forEach(l => {
                        const c = channels.find(x => x.nickname === l.channel || x.channelId === l.channel);
                        if (c && l.status !== 'processing') {
                            c.status = l.status;
                            const b = document.querySelector(`#card-${c.id} .channel-status-badge`);
                            if (b) { b.className = `channel-status-badge status-${l.status}`; b.innerText = l.status; }
                        }
                    });
                    if (logs.some(l => l.message === 'MISSION_ACCOMPLISHED')) { clearInterval(logPoller); document.getElementById('statusPulse').style.background = '#3fb950'; setTimeout(() => document.getElementById('progressContainer').style.display = 'none', 2000); }
                    document.getElementById('logsContainer').innerHTML = logs.reverse().map(l => `<div class="log-entry"><span style="color:#8b949e">[${new Date(l.time).toLocaleTimeString()}]</span><span class="log-${l.status}">${l.status.toUpperCase()}</span><span style="font-weight:600">${l.channel}</span><span>${l.message === 'MISSION_ACCOMPLISHED' ? '✅ Done' : l.message}</span></div>`).join('');
                } catch (e) { }
            }

            async function sendToBot() {
                document.getElementById('progressContainer').style.display = 'block';
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('statusPulse').style.background = '#d29922';
                channels.forEach(c => c.status = 'running'); renderChannels();
                logPoller = setInterval(pollLogs, 1000);
                await fetch('http://localhost:8000/dispatch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: document.getElementById('title').value, content: document.getElementById('content').value, imageDataURI, useEmbed: document.getElementById('useEmbed').checked, embedColor: document.getElementById('embedColor').value, channels: channels.map(c => ({ nickname: c.nickname, channelId: c.channelId, tagIds: c.tagIds, roleId: c.roleId || null })) }) });
            }

            async function syncAllData() { for (let c of channels) if (c.channelId) await fetchTags(c.id); alert("All synced!"); }
            function syncTagsByName() {
                const names = new Set();
                channels.forEach(c => c.tagIds.forEach(id => { const t = c.available_tags.find(x => x.id === id); if (t) names.add(t.name); }));
                channels.forEach(c => c.available_tags.forEach(t => { if (names.has(t.name) && !c.tagIds.includes(t.id)) c.tagIds.push(t.id); }));
                renderChannels(); saveToLocalStorage();
            }
            function syncRolesByName() { channels.forEach(c => { if (c.guildId) { const m = getRoleMemory(c.guildId); if (m) c.roleId = m; } }); renderChannels(); saveToLocalStorage(); }

            function generateJSON() { const p = { title: document.getElementById('title').value, content: document.getElementById('content').value, imageDataURI, useEmbed: document.getElementById('useEmbed').checked, embedColor: document.getElementById('embedColor').value, channels: channels.map(c => ({ nickname: c.nickname, channelId: c.channelId, tagIds: c.tagIds, roleId: c.roleId || null })) }; document.getElementById('jsonViewer').innerText = JSON.stringify(p, null, 2); return JSON.stringify(p); }
            function copyJSON() { navigator.clipboard.writeText(generateJSON()).then(() => alert('Copied!')); }
        </script>
</body>
